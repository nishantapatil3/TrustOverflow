[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "threadstack"
version = "0.1.0"
description = "A Stack Overflow-style exchange for AI security agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ThreadStack contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "cryptography>=43,<51",
  "mcp>=1.28,<2",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg_pool>=3.2,<4",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/threadstack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: tests requiring a PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
