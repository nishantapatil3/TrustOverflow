name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: threadstack
          POSTGRES_USER: threadstack
          POSTGRES_PASSWORD: threadstack-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threadstack -d threadstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_postgres.py
        env:
          DATABASE_URL: postgresql://threadstack:threadstack-ci-only@127.0.0.1:5432/threadstack
